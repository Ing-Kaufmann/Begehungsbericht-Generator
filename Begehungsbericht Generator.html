<style>
:root {
  --ci-blue:        #024665;
  --ci-teal:        #00ab84;
  --ci-blue-light:  #3B7A9C;
  --ci-teal-light:  #7DD4B8;
  --ci-sand:        #E8DFC8;
  --ci-coral:       #E07A5F;
  --ink:            #1F2A33;
  --ink-mid:        #6B7680;
  --line:           #D9DDE0;
  --bg:             #F7F8F9;
  --white:          #FFFFFF;
  --font-base: 'Nunito Sans', 'Open Sans', 'Segoe UI', Arial, sans-serif;
  --radius: 6px;
  --shadow-sm: 0 2px 8px rgba(2, 70, 101, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font-base); color: var(--ink);
  background: var(--bg); line-height: 1.55;
}
.app-header {
  background: var(--ci-blue); color: var(--white);
  padding: 1.1rem 1.5rem; display: flex; align-items: center; gap: 1rem;
  box-shadow: var(--shadow-sm);
}
.app-header img { height: 42px; width: 42px; border-radius: 4px; background: var(--white); }
.app-header .titles h1 { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--white); }
.app-header .titles p { margin: 0; font-size: 0.8rem; color: var(--ci-teal-light); font-weight: 600; }

.wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

.section-card {
  background: var(--white); border: 1px solid var(--line);
  border-left: 3px solid var(--ci-teal); border-radius: var(--radius);
  padding: 1.25rem 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem;
}
.section-card h2 {
  margin: 0 0 1rem; font-size: 1.05rem; font-weight: 700; color: var(--ci-blue);
  display: flex; align-items: center; gap: 0.5rem;
}
.section-card h2 .badge-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ci-teal); display: inline-block;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem 1.2rem; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

label {
  display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-mid);
  margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.02em;
}
input[type=text], input[type=date], textarea, select {
  width: 100%; font-family: var(--font-base); font-size: 0.92rem; color: var(--ink);
  border: 1px solid var(--line); border-radius: 4px; padding: 0.55rem 0.7rem;
  background: var(--bg); transition: border-color 0.15s;
}
input[type=text]:focus, input[type=date]:focus, textarea:focus, select:focus {
  outline: none; border-color: var(--ci-teal); background: var(--white);
}
textarea { resize: vertical; min-height: 4.2em; }
.field { margin-bottom: 0.9rem; }
.field:last-child { margin-bottom: 0; }

.punkt-card {
  background: var(--white); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 1.1rem 1.25rem 1.25rem; margin-bottom: 1rem; position: relative;
  box-shadow: var(--shadow-sm);
}
.punkt-head {
  display: flex; align-items: center; gap: 0.7rem; margin-bottom: 1rem;
}
.punkt-num {
  width: 28px; height: 28px; border-radius: 50%; background: var(--ci-blue); color: var(--white);
  font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.punkt-head input[type=text] { font-weight: 700; font-size: 1rem; color: var(--ci-blue); border: none;
  background: transparent; padding: 0.2rem 0.1rem; }
.punkt-head input[type=text]:focus { border-bottom: 1.5px solid var(--ci-teal); background: transparent; }

.btn-remove-punkt {
  margin-left: auto; background: none; border: none; color: var(--ink-mid);
  font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0.2rem 0.4rem; border-radius: 4px;
}
.btn-remove-punkt:hover { color: var(--ci-coral); background: var(--bg); }

.photo-zone {
  border: 1.5px dashed var(--line); border-radius: 4px; padding: 0.9rem;
  background: var(--bg); text-align: center; cursor: pointer; transition: border-color 0.15s;
}
.photo-zone:hover, .photo-zone.dragover { border-color: var(--ci-teal); }
.photo-zone p { margin: 0.3rem 0 0; font-size: 0.82rem; color: var(--ink-mid); }
.photo-zone svg { color: var(--ci-teal); }

.photo-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
.photo-item {
  display: flex; gap: 0.8rem; align-items: flex-start; border: 1px solid var(--line);
  border-radius: 4px; padding: 0.6rem; background: var(--bg);
}
.photo-item .thumb-wrap { position: relative; flex-shrink: 0; }
.photo-item img {
  width: 120px; height: 90px; object-fit: cover; border-radius: 4px; display: block;
  border: 1px solid var(--line);
}
.photo-item .cap-field { flex: 1; }
.photo-item .cap-field label {
  margin-bottom: 0.2rem; font-size: 0.72rem;
}
.photo-item .cap-field textarea { min-height: 3.2em; font-size: 0.85rem; }
.photo-item .btn-remove-foto {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(31,42,51,0.8); color: var(--white); border: none; cursor: pointer;
  font-size: 0.85rem; line-height: 1; display: flex; align-items: center; justify-content: center;
}
.photo-item .btn-remove-foto:hover { background: var(--ci-coral); }

.btn-primary {
  background: var(--ci-teal); color: var(--white);
  padding: 0.75em 1.5em; border: none; border-radius: var(--radius);
  font: 700 0.95rem var(--font-base); cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: #019170; }
.btn-primary:disabled { background: var(--ink-mid); cursor: wait; }

.btn-secondary {
  background: transparent; color: var(--ci-blue);
  border: 1.5px solid var(--ci-blue); padding: 0.65em 1.4em;
  border-radius: var(--radius); font: 700 0.9rem var(--font-base); cursor: pointer;
}
.btn-secondary:hover { background: var(--bg); }

.action-bar {
  position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 60%, transparent);
  padding: 1rem 0 0.5rem; display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap;
}
.status-msg { font-size: 0.85rem; color: var(--ink-mid); }
.status-msg.ok { color: var(--ci-teal); font-weight: 600; }

.empty-hint { text-align: center; color: var(--ink-mid); font-size: 0.88rem; padding: 1.5rem 0; }
</style>

            <rect x="3" y="4" width="18" height="16" rx="2"></rect>

        </div>

<input type="file" id="photo-input-hidden" accept="image/*" multiple="" style="display:none">

<script>
// ===================== Datenmodell =====================
let punkte = [];
let punktIdCounter = 0;

const CI = {
  blue: '#024665', teal: '#00ab84', blueLight: '#3B7A9C', tealLight: '#7DD4B8',
  sand: '#E8DFC8', coral: '#E07A5F', ink: '#1F2A33', inkMid: '#6B7680',
  line: '#D9DDE0', bg: '#F7F8F9', white: '#FFFFFF'
};

function hexToRgb(hex) {
  const v = hex.replace('#', '');
  return [parseInt(v.substring(0,2),16), parseInt(v.substring(2,4),16), parseInt(v.substring(4,6),16)];
}

function neuerPunkt() {
  punktIdCounter += 1;
  return { id: punktIdCounter, bereich: '', feststellung: '', empfehlung: '',
            verantwortlich: '', frist: '', fotos: [] };
}

function addPunkt() {
  punkte.push(neuerPunkt());
  renderPunkte();
}

function removePunkt(id) {
  punkte = punkte.filter(p => p.id !== id);
  renderPunkte();
}

function updatePunktField(id, field, value) {
  const p = punkte.find(p => p.id === id);
  if (p) p[field] = value;
}

// ===================== Foto-Verarbeitung =====================
const MAX_DIM = 1600; // px, Begrenzung für Dateigröße im PDF

function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > MAX_DIM || h > MAX_DIM) {
          const scale = Math.min(MAX_DIM / w, MAX_DIM / h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        resolve({ dataUrl, width: w, height: h, name: file.name, caption: '' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleFiles(punktId, fileList) {
  const p = punkte.find(p => p.id === punktId);
  if (!p) return;
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  for (const file of files) {
    try {
      const foto = await resizeImageFile(file);
      p.fotos.push(foto);
    } catch (err) { console.error('Foto konnte nicht geladen werden:', err); }
  }
  renderPunkte();
}

function removeFoto(punktId, fotoIdx) {
  const p = punkte.find(p => p.id === punktId);
  if (p) p.fotos.splice(fotoIdx, 1);
  renderPunkte();
}

function updateFotoCaption(punktId, fotoIdx, value) {
  const p = punkte.find(p => p.id === punktId);
  if (p && p.fotos[fotoIdx]) p.fotos[fotoIdx].caption = value;
}

// ===================== Rendering (UI) =====================
function renderPunkte() {
  const container = document.getElementById('punkte-container');
  const emptyHint = document.getElementById('empty-hint');
  container.innerHTML = '';
  emptyHint.style.display = punkte.length === 0 ? 'block' : 'none';

  punkte.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'punkt-card';
    card.innerHTML = `
      <div class="punkt-head">
        <div class="punkt-num">${idx + 1}</div>
        <input type="text" placeholder="Bereich / Gewerk (z. B. Dach, Heizungsraum, Fenster OG)"
               value="${escapeAttr(p.bereich)}" data-field="bereich" style="flex:1;">
        <button type="button" class="btn-remove-punkt" title="Punkt entfernen">&times;</button>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>Feststellung / Beschreibung</label>
          <textarea data-field="feststellung" placeholder="Was wurde festgestellt?">${escapeHtml(p.feststellung)}</textarea>
        </div>
        <div class="field">
          <label>Empfehlung / Maßnahme</label>
          <textarea data-field="empfehlung" placeholder="Empfohlene nächste Schritte">${escapeHtml(p.empfehlung)}</textarea>
        </div>
        <div class="field">
          <label>Verantwortlich (optional)</label>
          <input type="text" data-field="verantwortlich" value="${escapeAttr(p.verantwortlich)}" placeholder="z. B. Fa. Mustermann">
        </div>
        <div class="field">
          <label>Frist (optional)</label>
          <input type="date" data-field="frist" value="${escapeAttr(p.frist)}">
        </div>
      </div>
      <div class="field" style="margin-top:0.9rem;">
        <label>Fotos</label>
        <div class="photo-zone" data-role="dropzone">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 16l4.5-6 4 5 3-4L20 16" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.3"/>
          </svg>
          <p>Fotos hierher ziehen oder klicken zum Auswählen</p>
        </div>
        <div class="photo-list">
          ${p.fotos.map((f, fi) => `
            <div class="photo-item">
              <div class="thumb-wrap">
                <img src="${f.dataUrl}" alt="${escapeAttr(f.name)}">
                <button type="button" class="btn-remove-foto" data-role="removefoto" data-fotoidx="${fi}" title="Foto entfernen">&times;</button>
              </div>
              <div class="cap-field">
                <label>Beschriftung (erscheint im PDF rechts vom Bild)</label>
                <textarea data-role="caption" data-fotoidx="${fi}" placeholder="z. B. Riss im Sturzbereich, Ansicht von Süden …">${escapeHtml(f.caption)}</textarea>
              </div>
            </div>`).join('')}
        </div>
      </div>
    `;
    container.appendChild(card);

    // Event-Bindings
    card.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', () => updatePunktField(p.id, el.dataset.field, el.value));
    });
    card.querySelector('.btn-remove-punkt').addEventListener('click', () => removePunkt(p.id));

    card.querySelectorAll('[data-role="caption"]').forEach(el => {
      el.addEventListener('input', () => updateFotoCaption(p.id, parseInt(el.dataset.fotoidx, 10), el.value));
    });

    const dropzone = card.querySelector('[data-role="dropzone"]');
    dropzone.addEventListener('click', () => {
      const input = document.getElementById('photo-input-hidden');
      input.onchange = (e) => handleFiles(p.id, e.target.files).then(() => { input.value = ''; });
      input.click();
    });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.classList.remove('dragover');
      handleFiles(p.id, e.dataTransfer.files);
    });

    card.querySelectorAll('[data-role="removefoto"]').forEach(btn => {
      btn.addEventListener('click', () => removeFoto(p.id, parseInt(btn.dataset.fotoidx, 10)));
    });
  });
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str) { return escapeHtml(str); }

// ===================== Entwurf speichern / laden =====================
const DRAFT_KEY = 'ik_begehungsbericht_draft_v1';

function sammleProjektdaten() {
  return {
    projekt: document.getElementById('f-projekt').value,
    adresse: document.getElementById('f-adresse').value,
    datum: document.getElementById('f-datum').value,
    nr: document.getElementById('f-nr').value,
    teilnehmer: document.getElementById('f-teilnehmer').value,
    wetter: document.getElementById('f-wetter').value,
    allgemein: document.getElementById('f-allgemein').value
  };
}

function setzeStatus(msg, ok) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg' + (ok ? ' ok' : '');
  if (msg) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
}

function entwurfSpeichern() {
  try {
    const draft = { projekt: sammleProjektdaten(), punkte, punktIdCounter };
    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
    setzeStatus('Entwurf lokal gespeichert.', true);
  } catch (err) {
    console.error(err);
    setzeStatus('Speichern fehlgeschlagen (evtl. zu viele/große Fotos).', false);
  }
}

function entwurfLaden() {
  const raw = localStorage.getItem(DRAFT_KEY);
  if (!raw) { setzeStatus('Kein gespeicherter Entwurf gefunden.', false); return; }
  try {
    const draft = JSON.parse(raw);
    document.getElementById('f-projekt').value = draft.projekt.projekt || '';
    document.getElementById('f-adresse').value = draft.projekt.adresse || '';
    document.getElementById('f-datum').value = draft.projekt.datum || '';
    document.getElementById('f-nr').value = draft.projekt.nr || '';
    document.getElementById('f-teilnehmer').value = draft.projekt.teilnehmer || '';
    document.getElementById('f-wetter').value = draft.projekt.wetter || '';
    document.getElementById('f-allgemein').value = draft.projekt.allgemein || '';
    punkte = draft.punkte || [];
    punktIdCounter = draft.punktIdCounter || punkte.length;
    renderPunkte();
    setzeStatus('Entwurf geladen.', true);
  } catch (err) {
    console.error(err);
    setzeStatus('Entwurf konnte nicht geladen werden.', false);
  }
}

function zuruecksetzen() {
  if (!confirm('Wirklich alle Eingaben zurücksetzen? Nicht gespeicherte Daten gehen verloren.')) return;
  document.getElementById('f-projekt').value = '';
  document.getElementById('f-adresse').value = '';
  document.getElementById('f-datum').value = '';
  document.getElementById('f-nr').value = '';
  document.getElementById('f-teilnehmer').value = '';
  document.getElementById('f-wetter').value = '';
  document.getElementById('f-allgemein').value = '';
  punkte = [];
  renderPunkte();
  setzeStatus('Zurückgesetzt.', true);
}

// ===================== PDF-Erzeugung =====================
const PAGE_W = 210, PAGE_H = 297;
const MARGIN_L = 15, MARGIN_R = 15;
const CONTENT_W = PAGE_W - MARGIN_L - MARGIN_R;
const HEADER_BOTTOM_Y = 32;
const CONTENT_TOP_Y = 40;
const FOOTER_LINE_Y = 281;
const CONTENT_BOTTOM_LIMIT = 277;

let LOGO_DATA_URL = null; // wird beim Laden der Seite gesetzt

function drawHeader(doc) {
  const [br, bg_, bb] = hexToRgb(CI.blue);
  const [tr, tg, tb] = hexToRgb(CI.teal);
  const [mr, mg, mb] = hexToRgb(CI.inkMid);

  if (LOGO_DATA_URL) {
    try { doc.addImage(LOGO_DATA_URL, 'JPEG', MARGIN_L, 8, 18, 18); } catch (e) { /* ignore */ }
  }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12.5);
  doc.setTextColor(tr, tg, tb);
  doc.text('INGENIEURBÜRO KAUFMANN', 40, 14);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.3);
  doc.setTextColor(br, bg_, bb);
  doc.text('TGA-Planung · Energieberatung · Wärmekonzepte', 40, 19);

  doc.setFontSize(8);
  doc.setTextColor(mr, mg, mb);
  doc.text('Ringstraße 10A · 97903 Collenberg', PAGE_W - MARGIN_R, 12, { align: 'right' });
  doc.text('info@ing-kaufmann.de', PAGE_W - MARGIN_R, 16.5, { align: 'right' });
  doc.text('0162 / 72 22 043', PAGE_W - MARGIN_R, 21, { align: 'right' });

  doc.setDrawColor(tr, tg, tb);
  doc.setLineWidth(0.5);
  doc.line(MARGIN_L, HEADER_BOTTOM_Y, PAGE_W - MARGIN_R, HEADER_BOTTOM_Y);
}

function drawFooterOnPage(doc, pageNum, totalPages) {
  const [tr, tg, tb] = hexToRgb(CI.teal);
  const [mr, mg, mb] = hexToRgb(CI.inkMid);
  doc.setDrawColor(tr, tg, tb);
  doc.setLineWidth(0.35);
  doc.line(MARGIN_L, FOOTER_LINE_Y, PAGE_W - MARGIN_R, FOOTER_LINE_Y);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.3);
  doc.setTextColor(mr, mg, mb);
  doc.text('Ingenieurbüro Kaufmann · Ringstraße 10A · 97903 Collenberg · info@ing-kaufmann.de · 0162 / 72 22 043',
            MARGIN_L, 286);
  doc.text(`Seite ${pageNum} von ${totalPages}`, PAGE_W - MARGIN_R, 286, { align: 'right' });
}

function formatDatum(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function checkPageBreak(doc, cursorY, needed) {
  if (cursorY + needed > CONTENT_BOTTOM_LIMIT) {
    doc.addPage();
    drawHeader(doc);
    return CONTENT_TOP_Y;
  }
  return cursorY;
}

function computeFotoLayout(f, availW, maxImgH) {
  let imgW = Math.min(78, availW * 0.50);
  let imgH = imgW * (f.height / f.width);
  if (imgH > maxImgH) { imgH = maxImgH; imgW = imgH * (f.width / f.height); }
  const captionX = imgW + 6;
  const captionW = availW - imgW - 6;
  return { imgW, imgH, captionX, captionW };
}

async function generatePDF() {
  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.textContent = 'PDF wird erzeugt …';
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
    const proj = sammleProjektdaten();

    drawHeader(doc);

    let y = CONTENT_TOP_Y;
    const [br, bg_, bb] = hexToRgb(CI.blue);
    const [inkR, inkG, inkB] = hexToRgb(CI.ink);
    const [lr, lg, lb] = hexToRgb(CI.line);
    const [bgR, bgG, bgB] = hexToRgb(CI.bg);
    const [midR, midG, midB] = hexToRgb(CI.inkMid);

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(19);
    doc.setTextColor(br, bg_, bb);
    doc.text('BEGEHUNGSBERICHT', MARGIN_L, y);
    y += 8;

    // Meta-Box
    const metaRows = [
      ['Projekt', proj.projekt], ['Adresse', proj.adresse],
      ['Datum', formatDatum(proj.datum)], ['Begehungs-Nr. / BA', proj.nr],
      ['Teilnehmer', proj.teilnehmer], ['Wetter', proj.wetter]
    ].filter(r => r[1]);

    if (metaRows.length) {
      const rowH = 6;
      const boxH = 4 + Math.ceil(metaRows.length / 2) * rowH + 4;
      doc.setFillColor(bgR, bgG, bgB);
      doc.setDrawColor(lr, lg, lb);
      doc.roundedRect(MARGIN_L, y, CONTENT_W, boxH, 2, 2, 'FD');
      let mx = MARGIN_L + 4, my = y + 7, col = 0;
      const colWidth = CONTENT_W / 2;
      metaRows.forEach(([label, val]) => {
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.3);
        doc.setTextColor(br, bg_, bb);
        doc.text(label + ':', mx, my);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
        doc.setTextColor(inkR, inkG, inkB);
        const valLines = doc.splitTextToSize(String(val), colWidth - 34);
        doc.text(valLines, mx + 32, my);
        col += 1;
        if (col % 2 === 0) { mx = MARGIN_L + 4; my += rowH; }
        else { mx = MARGIN_L + 4 + colWidth; }
      });
      y += boxH + 6;
    }

    if (proj.allgemein) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
      doc.setTextColor(br, bg_, bb);
      doc.text('Allgemeine Anmerkungen', MARGIN_L, y);
      y += 5;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.3);
      doc.setTextColor(inkR, inkG, inkB);
      const lines = doc.splitTextToSize(proj.allgemein, CONTENT_W);
      y = checkPageBreak(doc, y, lines.length * 4.6 + 4);
      doc.text(lines, MARGIN_L, y);
      y += lines.length * 4.6 + 6;
    }

    if (punkte.length) {
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5);
      doc.setTextColor(br, bg_, bb);
      y = checkPageBreak(doc, y, 8);
      doc.text('Begehungspunkte', MARGIN_L, y);
      y += 7;
    }

    punkte.forEach((p, idx) => {
      // ---- Segmente vorab berechnen (für sauberen, geschlossenen Seitenumbruch) ----
      const titel = p.bereich || `Begehungspunkt ${idx + 1}`;

      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.3);
      const feststellungLines = p.feststellung ? doc.splitTextToSize(p.feststellung, CONTENT_W - 9) : [];
      const empfehlungLines = p.empfehlung ? doc.splitTextToSize(p.empfehlung, CONTENT_W - 9) : [];
      const hatMeta = !!(p.verantwortlich || p.frist);

      const availW = CONTENT_W - 9;
      const maxImgH = 68;
      const fotoLayouts = p.fotos.map(f => {
        const layout = computeFotoLayout(f, availW, maxImgH);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
        const capLines = f.caption ? doc.splitTextToSize(f.caption, layout.captionW) : [];
        const rowH = Math.max(layout.imgH, capLines.length * 4.8 + 2);
        return { f, layout, capLines, rowH };
      });

      const headerH = 7.5;
      const feststellungH = feststellungLines.length ? feststellungLines.length * 4.3 + 7 : 0;
      const empfehlungH = empfehlungLines.length ? empfehlungLines.length * 4.3 + 7 : 0;
      const metaH = hatMeta ? 5.5 : 0;
      const fotosH = fotoLayouts.reduce((sum, fl) => sum + fl.rowH + 4, 0);
      const trennH = 7;
      const totalHeight = headerH + feststellungH + empfehlungH + metaH + fotosH + trennH;
      const fullPageCapacity = CONTENT_BOTTOM_LIMIT - CONTENT_TOP_Y;

      // Passt der gesamte Punkt auf eine leere Seite, aber nicht mehr auf den
      // aktuellen Seitenrest? Dann den kompletten Punkt auf eine neue Seite schieben,
      // statt ihn mitten im Text/Foto abzuschneiden oder die Überschrift zu verwaisen.
      if (totalHeight <= fullPageCapacity && (y + totalHeight) > CONTENT_BOTTOM_LIMIT) {
        doc.addPage();
        drawHeader(doc);
        y = CONTENT_TOP_Y;
      }

      // ---- Kopfzeile des Punkts: Nummer + Titel ----
      y = checkPageBreak(doc, y, headerH);
      const numR = 3.2;
      doc.setFillColor(br, bg_, bb);
      doc.circle(MARGIN_L + numR, y - 1, numR, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
      doc.setTextColor(255, 255, 255);
      doc.text(String(idx + 1), MARGIN_L + numR, y - 1 + 1.1, { align: 'center' });

      doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
      doc.setTextColor(br, bg_, bb);
      doc.text(titel, MARGIN_L + 9, y);
      y += 5.5;

      // ---- Feststellung ----
      if (feststellungLines.length) {
        y = checkPageBreak(doc, y, feststellungH);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.3);
        doc.setTextColor(midR, midG, midB);
        doc.text('FESTSTELLUNG', MARGIN_L + 9, y);
        y += 4;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.3);
        doc.setTextColor(inkR, inkG, inkB);
        doc.text(feststellungLines, MARGIN_L + 9, y);
        y += feststellungLines.length * 4.3 + 3;
      }

      // ---- Empfehlung ----
      if (empfehlungLines.length) {
        y = checkPageBreak(doc, y, empfehlungH);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8.3);
        doc.setTextColor(midR, midG, midB);
        doc.text('EMPFEHLUNG / MASSNAHME', MARGIN_L + 9, y);
        y += 4;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(9.3);
        doc.setTextColor(inkR, inkG, inkB);
        doc.text(empfehlungLines, MARGIN_L + 9, y);
        y += empfehlungLines.length * 4.3 + 3;
      }

      // ---- Verantwortlich / Frist ----
      if (hatMeta) {
        y = checkPageBreak(doc, y, metaH);
        doc.setFont('helvetica', 'italic'); doc.setFontSize(8.3);
        doc.setTextColor(midR, midG, midB);
        const parts = [];
        if (p.verantwortlich) parts.push('Verantwortlich: ' + p.verantwortlich);
        if (p.frist) parts.push('Frist: ' + formatDatum(p.frist));
        doc.text(parts.join('   ·   '), MARGIN_L + 9, y);
        y += 5.5;
      }

      // ---- Fotos: Bild links, Beschriftung rechts daneben ----
      fotoLayouts.forEach(({ f, layout, capLines, rowH }) => {
        y = checkPageBreak(doc, y, rowH + 4);
        const px = MARGIN_L + 9;
        try { doc.addImage(f.dataUrl, 'JPEG', px, y, layout.imgW, layout.imgH); } catch (e) { /* ignore */ }
        doc.setDrawColor(lr, lg, lb);
        doc.setLineWidth(0.2);
        doc.rect(px, y, layout.imgW, layout.imgH);

        if (capLines.length) {
          doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
          doc.setTextColor(inkR, inkG, inkB);
          doc.text(capLines, px + layout.captionX, y + 4);
        }
        y += rowH + 4;
      });

      // ---- Trennlinie ----
      y = checkPageBreak(doc, y, trennH);
      doc.setDrawColor(lr, lg, lb);
      doc.setLineWidth(0.25);
      doc.line(MARGIN_L, y, PAGE_W - MARGIN_R, y);
      y += 7;
    });

    // Unterschriftenfeld am Ende
    y = checkPageBreak(doc, y, 26);
    y += 4;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(inkR, inkG, inkB);
    const sigW = (CONTENT_W - 12) / 2;
    doc.setDrawColor(lr, lg, lb);
    doc.line(MARGIN_L, y + 14, MARGIN_L + sigW, y + 14);
    doc.line(MARGIN_L + sigW + 12, y + 14, MARGIN_L + sigW + 12 + sigW, y + 14);
    doc.setFontSize(8); doc.setTextColor(midR, midG, midB);
    doc.text('Ort, Datum, Unterschrift (Ingenieurbüro Kaufmann)', MARGIN_L, y + 18);
    doc.text('Ort, Datum, Unterschrift (Auftraggeber / Fachunternehmer)', MARGIN_L + sigW + 12, y + 18);

    // Footer auf allen Seiten nachträglich einfügen
    const totalPages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= totalPages; i++) {
      doc.setPage(i);
      drawFooterOnPage(doc, i, totalPages);
    }

    const dateStr = proj.datum || new Date().toISOString().split('T')[0];
    const projektSlug = (proj.projekt || 'Begehungsbericht').replace(/[^a-zA-Z0-9_\-]+/g, '_').slice(0, 40);
    doc.save(`Begehungsbericht_${projektSlug}_${dateStr}.pdf`);
    setzeStatus('PDF wurde erstellt und heruntergeladen.', true);
  } catch (err) {
    console.error(err);
    setzeStatus('Fehler bei der PDF-Erzeugung: ' + err.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'PDF erzeugen';
  }
}

// ===================== Init =====================
document.addEventListener('DOMContentLoaded', () => {
  LOGO_DATA_URL = document.querySelector('.app-header img').src;
  document.getElementById('f-datum').valueAsDate = new Date();
  document.getElementById('btn-add-punkt').addEventListener('click', addPunkt);
  document.getElementById('btn-generate').addEventListener('click', generatePDF);
  document.getElementById('btn-save-draft').addEventListener('click', entwurfSpeichern);
  document.getElementById('btn-load-draft').addEventListener('click', entwurfLaden);
  document.getElementById('btn-reset').addEventListener('click', zuruecksetzen);
  addPunkt();
  renderPunkte();
});

</script>
